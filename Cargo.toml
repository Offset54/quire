[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "spikes/*/src-tauri", "tools/fixtures", "tools/refsim", "spikes/webview2-floor", "spikes/source-scan"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# cargo-fuzz builds with --cfg fuzzing (fuzz/, ADR-0020).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
