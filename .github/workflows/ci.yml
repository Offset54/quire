# CI (M0 task 3). Windows is the primary platform and runs every gate;
# macOS and Linux build and test. Actions are pinned by commit SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (all gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm run check:licenses
      - name: Frontend build
        run: pnpm --filter @quire/desktop build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  ui-flows:
    # WebDriver UI flows against the release app (ADR-0020): tauri-driver
    # plus the msedgedriver that matches the runner's WebView2 runtime.
    name: Windows UI flows (WebDriver)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Release app
        run: pnpm --filter @quire/desktop tauri build --no-bundle
      - name: UI flows
        shell: pwsh
        run: pwsh tools/webdriver/run-ui-tests.ps1 -NoBuild

  bench-regression:
    # A/B on the same runner: benchmarks of the PR's base and head run back to
    # back in one job, so runner-to-runner variance cancels out (§10: fail
    # on regressions over 10 %).
    name: Micro-benchmark regressions (A/B)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Benchmarks on the base commit
        shell: bash
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          if [ -d crates/core/benches ]; then cargo bench -p quire-core -- --save-baseline base --noplot; fi
      - name: Benchmarks on the PR head
        shell: bash
        run: |
          git checkout --quiet ${{ github.event.pull_request.head.sha }}
          cargo bench -p quire-core -- --save-baseline head --noplot
      - name: Compare
        run: node tools/bench/compare.mjs criterion base head --threshold 10

  cargo-deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources bans

  unix:
    name: ${{ matrix.name }} (build and test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quire/desktop build
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
