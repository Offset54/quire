[package]
name = "quire-highlight"
description = "Code highlighting with tree-sitter: the grammar set of M2 decision D, HTML spans, a size cap (ADR-0029)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-md = "0.5"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[lints]
workspace = true
