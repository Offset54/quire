[package]
name = "quire-markdown"
description = "Markdown engine: block index with incremental re-parsing, reference and footnote tables, block rendering, sanitization (MASTER_PROMPT §6.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
quire-text = { path = "../text" }
quire-highlight = { path = "../highlight" }
caseless = "0.2"
comrak = { version = "0.56", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
proptest = "1"
quire-core = { path = "../core" }

[lints]
workspace = true
