[package]
name = "quire-refsim"
description = "Reference-machine emulation helper for benchmarks (ADR-0021). Windows only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "refsim"
path = "src/main.rs"

[dependencies]
quire-raster = { path = "../../crates/raster" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[lints]
workspace = true
