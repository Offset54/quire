[package]
name = "quire-desktop"
description = "quire desktop shell (Tauri host)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
quire-core = { path = "../../../crates/core" }
quire-raster = { path = "../../../crates/raster" }
quire-text = { path = "../../../crates/text" }
quire-markdown = { path = "../../../crates/markdown" }
quire-highlight = { path = "../../../crates/highlight" }
quire-pdf = { path = "../../../crates/pdf" }
encoding_rs = "0.8"
notify = "8"
qoi = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls-no-default"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Synthetic documents and in-app benchmark scenarios (M0 task 9/12).
# Never enabled in release builds that ship.
bench-fixtures = []

[lints]
workspace = true
