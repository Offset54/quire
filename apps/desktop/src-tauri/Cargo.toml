[package]
name = "quire-desktop"
description = "quire desktop shell (Tauri host)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
quire-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[lints]
workspace = true
