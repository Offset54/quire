[package]
name = "quire-desktop"
description = "quire desktop shell (Tauri host)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
quire-core = { path = "../../../crates/core" }
quire-raster = { path = "../../../crates/raster" }
qoi = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Synthetic documents and in-app benchmark scenarios (M0 task 9/12).
# Never enabled in release builds that ship.
bench-fixtures = []

[lints]
workspace = true
